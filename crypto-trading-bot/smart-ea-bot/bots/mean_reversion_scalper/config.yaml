name: mean_reversion_scalper
version: "0.1.0"
status: spec

assets:
  - BTCUSD
  - ETHUSD

timeframe: "5Min"

indicators:
  rsi_period: 14
  sma_period: 20
  atr_period: 14

entry:
  long_rsi_max: 30
  long_sma_filter: true
  short_rsi_min: 70
  short_sma_filter: true
  atr_min_pct: 0.003

exit:
  long_rsi_target: 50
  short_rsi_target: 50
  take_profit_pct: 0.01
  stop_loss_pct: 0.005
  max_hold_minutes: 30

risk:
  risk_per_trade_pct: 0.25
  max_positions_per_asset: 1
  cooldown_minutes: 15

session:
  start: "09:30"
  end: "16:00"
  timezone: "America/New_York"
